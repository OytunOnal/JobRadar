<svg xmlns="http://www.w3.org/2000/svg" width="880" height="168" viewBox="0 0 880 168" role="img" aria-label="JobRadar">
  <defs>
    <clipPath id="panel"><rect x="0.5" y="0.5" width="879" height="167" rx="14"/></clipPath>
    <!-- Range rings fade in and then out, so the field reads as depth and never
         competes with the wordmark sitting on top of it. -->
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.18" stop-color="#3ec5b7" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#3ec5b7" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#3ec5b7" stop-opacity="0.05"/>
    </linearGradient>
    <!-- The lit sector dissolves by 80% of the width. Without it the sector's
         trailing edge is a hard horizontal line running the full panel, which
         reads as a stripe rather than as a beam. -->
    <linearGradient id="sweepfade" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3ec5b7" stop-opacity="0.26"/>
      <stop offset="0.45" stop-color="#3ec5b7" stop-opacity="0.07"/>
      <stop offset="0.8" stop-color="#3ec5b7" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="879" height="167" rx="14" fill="#0b0e14" stroke="#222a36"/>
  <g clip-path="url(#panel)">
    <!-- The mark's own rings, carried across the panel: the empty half of a
         masthead is where a radar would be looking. -->
    <g fill="none" stroke="url(#fade)" stroke-width="1">
      <circle cx="66" cy="84" r="120"/>
      <circle cx="66" cy="84" r="210"/>
      <circle cx="66" cy="84" r="310"/>
      <circle cx="66" cy="84" r="420"/>
      <circle cx="66" cy="84" r="540"/>
      <circle cx="66" cy="84" r="670"/>
      <circle cx="66" cy="84" r="810"/>
    </g>
    <!-- The sector the sweep has just passed over. Its leading edge is the
         sweep line itself — 52 degrees above horizontal, the same angle as the
         rotate(38) below — because the two are one object and looked like two
         when they did not line up. The panel is 168 rather than 132 to give
         that angle room to read as a diagonal. -->
    <path d="M66 84 L 880 -958 L 880 84 Z" fill="url(#sweepfade)"/>
    <!-- Contacts, fainter the further out, the way a return weakens. Some sit
         inside the lit sector and some below it. -->
    <g fill="#3dd68c">
      <circle cx="386" cy="53" r="2.6" opacity="0.85"/>
      <circle cx="527" cy="111" r="2.2" opacity="0.55"/>
      <circle cx="676" cy="64" r="2.4" opacity="0.4"/>
      <circle cx="806" cy="100" r="2" opacity="0.24"/>
      <circle cx="611" cy="39" r="1.8" opacity="0.3"/>
    </g>
  </g>
  <!-- The mark the app draws in its own header: two rings, a sweep, one
       contact. In the app the sweep spins; here it is frozen at one angle. -->
  <g transform="translate(66 84)">
    <circle r="30" fill="none" stroke="#2e3846" stroke-width="1.4"/>
    <circle r="16.5" fill="none" stroke="#2e3846" stroke-width="1.4"/>
    <line x1="0" y1="0" x2="0" y2="-28.5" stroke="#3ec5b7" stroke-width="2.2" stroke-linecap="round" transform="rotate(38)"/>
    <circle cx="12" cy="-10.5" r="3.8" fill="#3dd68c"/>
  </g>
  <text x="126" y="96" font-family="ui-monospace, 'Cascadia Code', 'JetBrains Mono', Consolas, 'SF Mono', Menlo, monospace" font-size="33" font-weight="600" letter-spacing="2.6" fill="#e8ecf1">JOBRADAR</text>
</svg>
